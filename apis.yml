aid: agencyzoom
name: AgencyZoom
description: >-
  AgencyZoom is a sales automation and customer retention platform built
  specifically for property and casualty insurance agencies, combining lead
  management, sales pipelines, automated onboarding, and producer performance
  analytics in one workflow. The platform integrates with major agency
  management systems and rating engines to consolidate prospect and policy
  data. AgencyZoom exposes a REST API documented via OpenAPI for accessing
  contacts, policies, pipeline, and activity data.
